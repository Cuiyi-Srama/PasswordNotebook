apply plugin: 'com.android.application'

android {
    namespace 'com.cuiyi.passwordnotebook'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cuiyi.passwordnotebook'
        minSdk 21
        targetSdk 35
        versionCode 3
        versionName '2.1'
    }

    buildTypes {
        debug {
            debuggable true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}