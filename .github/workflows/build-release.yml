name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v3.0)'
        required: true
        default: 'v3.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        id: find_apk
        run: |
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          if [ -z "$APK" ]; then echo "No APK produced"; exit 1; fi
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          ls -la "$APK"

      - name: Rename and checksum
        id: pack
        run: |
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          OUT="PasswordNotebook-${REF}.apk"
          cp "${{ steps.find_apk.outputs.apk_path }}" "$OUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          sha256sum "$OUT" | tee SHA256SUMS.txt
          ls -la "$OUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PasswordNotebook-APK
          path: |
            ${{ steps.pack.outputs.out }}
            SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: PasswordNotebook ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            ## Security upgrade v3.0

            **Root cause:** the AES key was derived with a public constant used as BOTH
            the PBKDF2 password and the salt. The key was therefore recomputable offline
            by anyone reading the APK, and the 10,000 iterations offered no protection
            at all, because there was no user secret to guess in the first place.

            **Fixes**
            - A user master password now feeds PBKDF2-HMAC-SHA256 together with a
              per-user random 16-byte salt and a device-calibrated iteration count.
            - The crypto layer is fail-closed: failures raise instead of silently
              falling back to plaintext or raw ciphertext.
            - The core word and custom salt are encrypted at rest using a
              non-exportable Android Keystore AES-GCM key.
            - Password derivation routes the core word through a KDF with a per-site
              random salt rather than a bare SHA-256. Random mode now uses rejection
              sampling to avoid modulo bias.
            - Existing data migrates transactionally: everything is decrypted to
              memory first, any failure aborts, then one atomic commit.

            **Also fixed:** two pre-existing compile errors that broke the build
            (LinearLayout.setRadius and a non-final lambda capture), plus a CI
            workflow, since the repository previously had none.

            > Migration is one-way. Anything stored under the old key should be
            > treated as already disclosed. Rotate passwords derived from the core
            > word after migrating. Randomly generated passwords are not weakened by
            > the key issue itself, but rotating high-value accounts is still wise.

            Verify the download against SHA256SUMS.txt.
          files: |
            ${{ steps.pack.outputs.out }}
            SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
