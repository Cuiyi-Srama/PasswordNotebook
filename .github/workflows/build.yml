name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "Signing secrets found: building a signed release APK."
            printf '%s' "$KEYSTORE_B64" | base64 -d > release.keystore
            ls -la release.keystore
            gradle :app:assembleRelease --no-daemon --stacktrace
          else
            echo "No signing secrets: falling back to a debug APK."
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Package
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=$(find app/build/outputs/apk/debug -name '*.apk' 2>/dev/null | head -1)
          fi
          if [ -z "$APK" ]; then echo "no apk produced"; exit 1; fi
          echo "Using $APK"
          REF="${GITHUB_REF_NAME}"
          if [ "$REF" = "main" ]; then REF="nightly-${GITHUB_SHA::7}"; fi
          OUT="PasswordNotebook-${REF}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee SHA256SUMS.txt
          ls -la "$OUT"

      - name: Report signature
        run: |
          APK=$(ls PasswordNotebook-*.apk | head -1)
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | head -1)
          if [ -n "$SIGNER" ]; then
            "$SIGNER" verify --print-certs "$APK" 2>&1 | head -20 || true
          else
            echo "apksigner not found, skipping"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: PasswordNotebook-APK
          path: |
            PasswordNotebook-*.apk
            SHA256SUMS.txt

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PasswordNotebook-*.apk
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
