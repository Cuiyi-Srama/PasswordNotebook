name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Package
        run: |
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          if [ -z "$APK" ]; then echo "no apk produced"; exit 1; fi
          REF="${GITHUB_REF_NAME}"
          if [ "$REF" = "main" ]; then
            REF="nightly-${GITHUB_SHA::7}"
          fi
          cp "$APK" "PasswordNotebook-${REF}.apk"
          sha256sum "PasswordNotebook-${REF}.apk" | tee SHA256SUMS.txt
          echo "REF=$REF" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: PasswordNotebook-APK
          path: |
            PasswordNotebook-*.apk
            SHA256SUMS.txt

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PasswordNotebook-*.apk
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
