name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f release.keystore ]; then
            echo "Signing secrets found: building a signed release APK."
            gradle :app:assembleRelease --no-daemon --stacktrace
          else
            echo "No signing secrets: falling back to a debug APK."
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Package
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=$(find app/build/outputs/apk/debug -name '*.apk' 2>/dev/null | head -1)
          fi
          if [ -z "$APK" ]; then echo "no apk produced"; exit 1; fi
          echo "Using $APK"
          REF="${GITHUB_REF_NAME}"
          if [ "$REF" = "main" ]; then REF="nightly-${GITHUB_SHA::7}"; fi
          OUT="PasswordNotebook-${REF}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee SHA256SUMS.txt
          ls -la "$OUT"

      - name: Verify signature
        run: |
          APK=$(ls PasswordNotebook-*.apk | head -1)
          if [ -f release.keystore ]; then
            $ANDROID_HOME/build-tools/*/apksigner verify --print-certs "$APK" || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: PasswordNotebook-APK
          path: |
            PasswordNotebook-*.apk
            SHA256SUMS.txt

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PasswordNotebook-*.apk
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
