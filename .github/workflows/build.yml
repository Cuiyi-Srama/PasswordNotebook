name: Build APK

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v4.0)'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode keystore
        id: keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          echo "have_keystore=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        id: build
        run: |
          if [ "${{ steps.keystore.outputs.have_keystore }}" = "true" ]; then
            gradle :app:assembleRelease --no-daemon --stacktrace
            APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          else
            echo "No signing secrets found; building a debug APK instead."
            gradle :app:assembleDebug --no-daemon --stacktrace
            APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "No APK was produced"
            exit 1
          fi
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          ls -la "$APK"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename and checksum
        id: pack
        run: |
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          if [ "$REF" = "" ] || [ "$REF" = "main" ]; then
            REF="nightly-$(date +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          OUT="PasswordNotebook-${REF}.apk"
          cp "${{ steps.build.outputs.apk }}" "$OUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          sha256sum "$OUT" | tee SHA256SUMS.txt
          ls -la "$OUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PasswordNotebook-APK
          path: |
            ${{ steps.pack.outputs.out }}
            SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: PasswordNotebook ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            See [README](https://github.com/${{ github.repository }}/blob/main/README.md)
            and [SECURITY](https://github.com/${{ github.repository }}/blob/main/SECURITY.md).

            Verify your download against `SHA256SUMS.txt`.

            If you used a version before v4.0: that build shipped a hardcoded AES
            key inside the APK, so anyone decompiling it could read every stored
            entry. Treat data saved by those versions as disclosed and rotate
            high-value credentials after migrating.
          files: |
            ${{ steps.pack.outputs.out }}
            SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
